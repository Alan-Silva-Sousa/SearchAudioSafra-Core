services:
  db:
    image: postgres:16
    container_name: searchaudio-db
    environment:
      POSTGRES_USER: searchaudio-safra
      POSTGRES_PASSWORD: searchaudio4me
      POSTGRES_DB: searchaudio4me_safra
    ports:
      - "5433:5432"
    volumes:
      - searchaudio_safra:/var/lib/postgresql/data

volumes:
  searchaudio_safra: